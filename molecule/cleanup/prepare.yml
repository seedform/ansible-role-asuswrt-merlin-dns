---
- name: Fake router
  ansible.builtin.import_playbook: ../resources/fake_router.yml

- name: Expose records on bridges that converge unexposes
  hosts: routers
  gather_facts: false
  module_defaults:
    ansible.builtin.raw:  # containers.podman.podman execs without a shell
      executable: /bin/sh
  tasks:
    - name: Apply role with three bridges
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        dns_add_bridges: [br52, br53, br54]
        dns_entries:
          - domain_names: [apps.internal]
            target: "10.0.0.1"

    - name: Create stale link for a removed dnsmasq instance
      ansible.builtin.raw: >-
        ln -s /jffs/configs/dnsmasq.conf.add
        /jffs/configs/dnsmasq-9.conf.add
      changed_when: true

    - name: Reset restarts
      ansible.builtin.include_tasks: ../resources/tasks/reset_restarts.yml

    - name: Read router state
      ansible.builtin.include_tasks: ../resources/tasks/read_state.yml

    - name: Check initial links
      ansible.builtin.assert:
        that:
          - _dns_test_links_cmd.stdout_lines == _dns_test_links_wanted
      vars:
        _dns_test_links_wanted:
          - "dnsmasq-2.conf.add -> /jffs/configs/dnsmasq.conf.add"
          - "dnsmasq-3.conf.add -> /jffs/configs/dnsmasq.conf.add"
          - "dnsmasq-4.conf.add -> /jffs/configs/dnsmasq.conf.add"
          - "dnsmasq-9.conf.add -> /jffs/configs/dnsmasq.conf.add"
